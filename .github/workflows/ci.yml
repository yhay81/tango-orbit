name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run release:check
        shell: pwsh
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit
