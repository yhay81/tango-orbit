name: Dictionary update

on:
  schedule:
    - cron: "18 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run dictionary:update
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Dictionary is current."
            exit 0
          fi
          branch="automation/jmdict-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/dictionary.json src/generated/dictionary.ts
          git commit -m "update JMdict data"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update JMdict data" \
            --body "Regenerated the compact dictionary from the latest checksum-verified JMdict release."
